<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account — Biofran Ventures</title>
<meta name="description" content="Create a Biofran Ventures account to easily track orders, request property viewings, and save delivery details.">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/all.css">
</head>
<body data-page-init="auth">

<div id="site-header"></div>
<div id="site-chrome"></div>

<main>
  <div class="container" style="max-width:480px;padding:4rem 1rem">
    <div class="card" style="padding:2.5rem">
      <div style="text-align:center;margin-bottom:1.8rem">
        <span class="eyebrow">New Customer</span>
        <h2>Create Account</h2>
        <p class="dim" style="font-size:.88rem;margin-top:.4rem">
          Join Biofran Ventures for faster checkouts and easy order tracking.
        </p>
      </div>

      <form id="registerForm">
        <div class="field">
          <label for="regName">Full Name</label>
          <input class="field-input" type="text" id="regName" name="name" required placeholder="e.g. Abraham Ifidon">
        </div>

        <div class="field" style="margin-top:1.2rem">
          <label for="regEmail">Email Address</label>
          <input class="field-input" type="email" id="regEmail" name="email" required placeholder="name@example.com">
        </div>

        <div class="field" style="margin-top:1.2rem">
          <label for="regPhone">Phone Number</label>
          <input class="field-input" type="tel" id="regPhone" name="phone" required placeholder="0803 721 1227">
        </div>

        <div class="field" style="margin-top:1.2rem">
          <label for="regPassword">Password (6+ characters)</label>
          <input class="field-input" type="password" id="regPassword" name="password" minlength="6" required placeholder="••••••••">
        </div>

        <button class="btn btn--gold btn--lg" type="submit" style="width:100%;margin-top:1.8rem">
          Create Account
        </button>
      </form>

      <div class="center dim" style="font-size:.88rem;margin-top:1.8rem">
        Already registered? <a href="/login" class="gold">Sign in</a>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<div id="site-floating"></div>

<script src="/js/api.js"></script>
<script src="/js/site.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/components.js"></script>
<script src="/js/pages/auth.js"></script>
<script src="/js/boot.js"></script>
</body>
</html>
