<!DOCTYPE html>

    <div class="container-wide">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="/">Home</a>

        <span aria-current="page">Biofran Properties</span>
      </nav>
      <div class="page-head__row">
        <div>
          <span class="eyebrow" style="color:var(--gold)">Housing Agency &amp; Real Estate</span>
          <h1 style="color:#fff">Biofran Properties</h1>
          <p style="color:rgba(255,255,255,.8);max-width:55ch;margin-top:.5rem">
            Verified titles, guided inspections, and transparent representation for property sales, residential rentals, short-lets, and titled land.
          </p>
        </div>
        <div class="row" style="gap:.8rem;flex-wrap:wrap">
          <a class="btn btn--gold" href="tel:07045723013">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.2-1.1a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2z"/></svg>
            Desk: 07045723013
          </a>
          <a class="btn btn--ghost" href="mailto:francisifidon3@gmail.com" style="color:#fff;border-color:rgba(255,255,255,.4)">
            Email Housing Desk
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="container-wide" style="padding-top:2.5rem;padding-bottom:4rem">
    <div class="property-filters-bar card" style="padding:1.2rem;margin-bottom:2rem;display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between">
      <div class="row" style="gap:.5rem;flex-wrap:wrap">
        <button class="btn btn--sm btn--ghost is-active" data-purpose-tab="" type="button">All Listings</button>
        <button class="btn btn--sm btn--ghost" data-purpose-tab="For Sale" type="button">For Sale</button>
        <button class="btn btn--sm btn--ghost" data-purpose-tab="For Rent" type="button">For Rent</button>
        <button class="btn btn--sm btn--ghost" data-purpose-tab="Short Let" type="button">Short Let</button>
      </div>

      <div class="row" style="gap:.8rem;flex-wrap:wrap">
        <select class="field-select" id="filterCity" style="min-width:160px">
          <option value="">All Locations</option>
        </select>
        <select class="field-select" id="sortProperties" style="min-width:160px">
          <option value="newest">Newest listings</option>
        </select>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
      <h3 id="propertiesCount">Loading properties…</h3>
    </div>

    <div class="grid grid--3" id="propertiesGrid">
      <div class="spinner"></div>
