<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping Cart — Biofran Ventures</title>
<meta name="description" content="Review your shopping cart, select delivery method, and proceed to checkout at Biofran Ventures.">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/all.css">
</head>
<body data-page-init="cart">

<div id="site-header"></div>
<div id="site-chrome"></div>

<main>
  <div class="page-head">
    <div class="container-wide">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="/">Home</a>
        <span aria-hidden="true">/</span>
        <span aria-current="page">Shopping Cart</span>
      </nav>
      <div class="page-head__row">
        <div>
          <span class="eyebrow">Your Bag</span>
          <h1>Shopping Cart</h1>
        </div>
      </div>
    </div>
  </div>

  <div class="container-wide" style="padding-bottom:4rem">
    <div class="cart-layout" style="display:grid;grid-template-columns:1fr 380px;gap:2.5rem;align-items:start">
      <div id="cartItems">
        <div class="spinner"></div>
      </div>
      <div id="cartSummary">
        <!-- Summary rendered by cart.js -->
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<div id="site-floating"></div>

<script src="/js/api.js"></script>
<script src="/js/site.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/components.js"></script>
<script src="/js/pages/cart.js"></script>
<script src="/js/boot.js"></script>
</body>
</html>
